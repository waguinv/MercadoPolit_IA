# MercadoPilot. Começa em HTTP; o "certbot --nginx" acrescenta o HTTPS e o redirecionamento neste arquivo.
server {
    listen 80;
    listen [::]:80;
    server_name gestor.sysordemsistemas.com.br;

    root /var/www/gestor;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        include snippets/gestor-seguranca.conf;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        # Sobrescreve em vez de acrescentar: o cliente não consegue falsificar o IP visto pelo limite de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Consultas ao ERP podem esperar o limite de requisições dele.
        proxy_read_timeout 130s;
    }

    # A sincronização de catálogo ainda roda dentro da requisição.
    location = /api/v1/catalog/sync {
        include snippets/gestor-seguranca.conf;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
    }

    # Nomes com hash: o conteúdo nunca muda.
    location /assets/ {
        include snippets/gestor-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Sem cache, para o celular receber a versão nova logo depois de uma atualização.
    location = /sw.js {
        include snippets/gestor-seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include snippets/gestor-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
