# Ambiente LOCAL de desenvolvimento. Não usar em produção (sem HTTPS/proxy).
# Valores vêm de .env (copie de .env.example). Os hosts "localhost" do .env.example
# são sobrescritos abaixo pelos nomes dos serviços do Compose.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: mercadopilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mercadopilot"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-change-me}@db:5432/mercadopilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
