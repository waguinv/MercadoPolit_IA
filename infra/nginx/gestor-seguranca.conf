# Incluído em cada location: no nginx, um add_header dentro da location anula os herdados.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
# Só este domínio, 30 dias: não atinge a central nem outros subdomínios. O navegador ignora em HTTP.
add_header Strict-Transport-Security "max-age=2592000" always;
